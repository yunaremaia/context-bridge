[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-bridge-py"
version = "0.2.0"
description = "Universal session memory for AI agents — capture, index, retrieve"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Yunare Maia", email = "yunare@gmail.com"}
]
keywords = ["ai-agent", "memory", "context", "session", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.5.0",
    "rich>=15.0.0",
    "pydantic>=2.13.5",
]

[project.urls]
Homepage = "https://github.com/yunaremaia/context-bridge"
Repository = "https://github.com/yunaremaia/context-bridge"
Issues = "https://github.com/yunaremaia/context-bridge/issues"
Changelog = "https://github.com/yunaremaia/context-bridge/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    # The install-name guard reads pyproject.toml; `tomllib` is stdlib only from
    # 3.11, and this project still supports 3.10.
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
context-bridge = "context_bridge.cli:main"

[tool.ruff.lint]
# Extend the defaults (E4/E7/E9/F) rather than replacing them, so pyflakes
# stays on while bugbear and pyupgrade rules are enforced in CI too.
extend-select = ["B", "UP"]
